name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths: ["demo/**", "js/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Allow only one concurrent deployment, but let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            js/package-lock.json
            demo/package-lock.json

      - name: Build JS codec
        run: npm ci && npm run build
        working-directory: js

      - name: Build demo bundle
        run: npm ci && npm run build
        working-directory: demo

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp demo/index.html _site/index.html
          cp -r demo/dist _site/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
