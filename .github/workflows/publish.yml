name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify versions and release tag
        run: python scripts/check_release_version.py "${{ github.event.release.tag_name }}"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: verify-release
    environment:
      name: pypi
      url: https://pypi.org/project/spectrl/
    permissions:
      contents: read # checkout (required on private repos when permissions is set)
      id-token: write # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run --locked pytest tests/ -q

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # workflow_dispatch reruns shouldn't fail on an already-uploaded version
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}

  publish-npm:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: verify-release
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@spectrl-ms/spectrl
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require a Trusted Publishing-capable npm CLI
        run: npm install --global npm@^11.5.1

      - name: Install, test, and build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Publish public package with OIDC provenance
        run: npm publish --access public

  publish-crates:
    name: Publish to crates.io
    if: github.event_name == 'release'
    needs: verify-release
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/spectrl
    permissions:
      contents: read
      id-token: write # used by the Trusted Publishing path below
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      # First release (3.0.0): crates.io allows Trusted Publishing only for a
      # crate that already exists, so this publish uses an API token.
      - name: Publish with the CARGO_REGISTRY_TOKEN secret
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # After 3.0.0 is on crates.io: configure its Trusted Publisher (see
      # RELEASING.md), replace the step above with these two, and delete the
      # CARGO_REGISTRY_TOKEN secret.
      # - name: Authenticate with crates.io Trusted Publishing
      #   uses: rust-lang/crates-io-auth-action@v1
      #   id: auth
      # - name: Publish
      #   run: cargo publish --locked
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
