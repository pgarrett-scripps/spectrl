]
provides-extras = ["brotli", "mzml"]

[package.metadata.requires-dev]
dev = [
    { name = "mzmlpy", specifier = ">=0.4.0" },
    { name = "pytest", specifier = ">=8.0.0" },
    { name = "pytest-cov", specifier = ">=6.0.0" },
    { name = "ruff", specifier = ">=0.3.0" },
]
